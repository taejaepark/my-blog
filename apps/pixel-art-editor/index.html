<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>픽셀 아트 에디터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>픽셀 아트 에디터</h1>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="다크모드 전환">🌓</button>
</header>

<main class="app-main">
  <div class="canvas-area">
    <canvas id="pixel-canvas" width="320" height="320" aria-label="16x16 픽셀 아트 캔버스"></canvas>
  </div>

  <div class="side-panel">
    <div class="palette" id="palette">
      <!-- 색상 스와치는 script.js가 동적으로 생성 -->
    </div>

    <div class="tool-row">
      <button id="eraser-btn" class="tool-btn" type="button">지우개</button>
      <div class="current-color-preview">
        <span>현재 색상</span>
        <span id="current-color-swatch" class="current-color-swatch"></span>
      </div>
      <input type="color" id="custom-color" value="#000000" aria-label="커스텀 색상 선택">
    </div>

    <div class="action-row">
      <button id="clear-btn" class="action-btn" type="button">전체 지우기</button>
      <button id="save-btn" class="action-btn" type="button">PNG로 저장</button>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
